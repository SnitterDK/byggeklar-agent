<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Byggeklar Agent architecture</title>
  <desc id="desc">Owner input flows through Strands Agent to a deterministic evidence gate and then to ready evidence, owner tasks, municipality questions and a permit pack.</desc>
  <rect width="1200" height="500" fill="#eef2ea"/>
  <style>.b{fill:#fff;stroke:#8aa28d;stroke-width:3;rx:18}.t{font:700 25px system-ui;fill:#163e28}.s{font:500 18px system-ui;fill:#53695a}.a{stroke:#39754d;stroke-width:5;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#39754d"/></marker></defs>
  <rect class="b" x="55" y="190" width="190" height="110"/><text class="t" x="150" y="232" text-anchor="middle">Owner input</text><text class="s" x="150" y="265" text-anchor="middle">facts + files</text>
  <path class="a" d="M245 245H330"/><rect class="b" x="330" y="190" width="200" height="110"/><text class="t" x="430" y="232" text-anchor="middle">Strands Agent</text><text class="s" x="430" y="265" text-anchor="middle">plans workflow</text>
  <path class="a" d="M530 245H615"/><rect class="b" x="615" y="170" width="230" height="150"/><text class="t" x="730" y="220" text-anchor="middle">Evidence gate</text><text class="s" x="730" y="255" text-anchor="middle">deterministic tool</text><text class="s" x="730" y="285" text-anchor="middle">unknown ≠ verified</text>
  <path class="a" d="M845 205H925V105"/><path class="a" d="M845 245H925"/><path class="a" d="M845 285H925V390"/>
  <rect class="b" x="925" y="45" width="220" height="100"/><text class="t" x="1035" y="88" text-anchor="middle">Ready evidence</text><text class="s" x="1035" y="120" text-anchor="middle">permit pack</text>
  <rect class="b" x="925" y="195" width="220" height="100"/><text class="t" x="1035" y="238" text-anchor="middle">Owner tasks</text><text class="s" x="1035" y="270" text-anchor="middle">measure + attach</text>
  <rect class="b" x="925" y="345" width="220" height="100"/><text class="t" x="1035" y="388" text-anchor="middle">Authority check</text><text class="s" x="1035" y="420" text-anchor="middle">local rules</text>
</svg>
